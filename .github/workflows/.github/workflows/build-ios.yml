name: Build and Deploy iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
    
    - name: Install dependencies
      run: |
        brew install carthage || true
    
    - name: Build for iOS
      run: |
        xcodebuild clean build \
          -scheme BancoCotasApp \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
    
    - name: Build for Simulator
      run: |
        xcodebuild clean build \
          -scheme BancoCotasApp \
          -configuration Release \
          -sdk iphonesimulator \
          -derivedDataPath build \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO
    
    - name: Create IPA
      run: |
        mkdir -p build/ipa
        xcodebuild -exportArchive \
          -archivePath build/BancoCotasApp.xcarchive \
          -exportPath build/ipa \
          -exportOptionsPlist ExportOptions.plist \
          || echo "IPA creation skipped - requires signing certificate"
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: BancoCotasApp-build
        path: build/
        retention-days: 7
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Build artifacts for BancoCotasApp
          - iOS build completed successfully
          - Download the build artifacts above
        draft: false
        prerelease: false
